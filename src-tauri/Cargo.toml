[package]
name = "guppy"
version = "1.0.0"
description = "Guppy: a clean YouTube downloader and audio converter for Windows"
edition = "2021"

[lib]
name = "guppy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs", "sync"] }
dirs = "6"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
